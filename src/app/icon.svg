<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Caribbean Adventure RD">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0077b6"/>
      <stop offset="1" stop-color="#005f8a"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb703"/>
      <stop offset="1" stop-color="#f77f00"/>
    </linearGradient>
  </defs>

  <!-- Ocean background -->
  <rect width="512" height="512" rx="112" fill="url(#sea)"/>

  <!-- Sun -->
  <circle cx="256" cy="212" r="92" fill="url(#sun)"/>

  <!-- Waves: kept thick and few so the mark stays legible at 16px -->
  <g fill="none" stroke="#ffffff" stroke-width="34" stroke-linecap="round">
    <path d="M74 356c30-26 60-26 91 0s60 26 91 0 60-26 91 0 60 26 91 0"/>
    <path d="M74 434c30-26 60-26 91 0s60 26 91 0 60-26 91 0 60 26 91 0"/>
  </g>
</svg>
